<!doctype html><html lang="pt-br"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/static/css/app_new.css?v=20261008vitrine2"><link rel="stylesheet" href="/static/css/fe_vitrine_blur_20261011.css?v=20261011-v33"><script src="/static/js/app_new.js?v=20261008vitrine2"></script><title>ForEvento — Eventos</title></head><body>
<header class="fe-public-top fe-vitrine-header"><a class="fe-logo" href="/">For<span>Evento</span></a><nav class="fe-public-nav" aria-label="Navegação principal"><a href="#featured">Eventos</a><a href="/manual-usuario">Ajuda</a><a class="btn blue" href="/login">Entrar</a></nav></header>
<main class="vitrine-page">
<section id="featured" aria-label="Evento em destaque"><div class="empty">Carregando evento em destaque...</div></section>
<section aria-label="Banners de divulgação"><div class="fe-section-heading"><h2>Banners de divulgação</h2><div class="fe-carousel-controls"><button id="prevBanner" aria-label="Banner anterior">‹</button><span class="count" id="bannerCount">0 / 0</span><button id="nextBanner" aria-label="Próximo banner">›</button></div></div><div id="banners" class="banner-carousel fe-public-banners"><div class="banner-empty fe-empty-banners">Carregando banners...</div></div></section>
<section class="events-public fe-other-events"><div class="fe-section-heading"><h2>Outros eventos</h2></div><div id="events" class="event-grid-public"></div></section>
</main><footer class="fe-public-footer"><div><strong>ForEvento</strong><p>Eventos, inscrições e certificados em um só lugar.</p></div><small>© 2026 ForEvento</small></footer>
<script>
const feEsc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const feId=v=>String(v??'').replace(/[^a-zA-Z0-9_-]/g,'_');
const feEventIds=new Map();
function feEventCard(e,featured=false){const id=feId(e.id);feEventIds.set(id,e.id);const name=feEsc(e.nome||'Evento');const img=e.imagem?`<img class="${featured?'fe-featured-img':'event-cover-public'}" src="${feEsc(e.imagem)}" alt="Capa de ${name}">`:`<div class="${featured?'fe-featured-img':'event-cover-public event-cover-empty'}">ForEvento</div>`;const copy=`<h${featured?'1':'2'}>${name}</h${featured?'1':'2'}><p>${feEsc(e.sinopseCurta||e.resumo||'')}</p><p class="event-meta">${feEsc(e.periodo||'')}${e.local?' · '+feEsc(e.local):''}</p><p class="slots">${feEsc(e.vagasDisponiveis??0)} vagas disponíveis</p><button type="button" class="btn blue" id="btn_${id}" data-event-toggle="${id}" aria-expanded="false">Ver evento e atividades</button><div id="c_${id}" class="${featured?'fe-featured-schedule':'event-schedule'}" hidden></div>`;return featured?`<article class="fe-featured">${img}<div class="fe-featured-copy">${copy}</div></article>`:`<article class="event-card-public">${img}<div class="event-card-body">${copy}</div></article>`}
async function toggleEvent(id){const d=document.getElementById('c_'+id),b=document.getElementById('btn_'+id);if(!d||!b)return;if(!d.hidden){d.hidden=true;b.textContent='Ver evento e atividades';b.setAttribute('aria-expanded','false');return}if(d.dataset.loaded==='1'){d.hidden=false;b.textContent='Ocultar atividades';b.setAttribute('aria-expanded','true');return}try{b.disabled=true;b.textContent='Carregando atividades...';const activities=await call('obterCronogramaPublico',feEventIds.get(id));d.innerHTML=activities.length?activities.map(x=>`<div class="activity public-activity"><strong>${feEsc(x.sinopse||x.ministrante||'Atividade')}</strong><div>${feEsc(x.data||'')} ${feEsc(x.hora||'')}</div><div>${feEsc(x.tipo||'')}${x.local?' · '+feEsc(x.local):''}</div><div class="slots">Vagas disponíveis: ${feEsc(x.vagasDisponiveis??0)}</div><button type="button" class="btn gray" data-require-login>Inscrever-se</button></div>`).join(''):'<div class="empty">Cronograma ainda não publicado.</div>';d.dataset.loaded='1';d.hidden=false;b.textContent='Ocultar atividades';b.setAttribute('aria-expanded','true')}catch(e){d.hidden=false;d.innerHTML='<div class="empty">Não foi possível carregar as atividades. Tente novamente.</div>';b.textContent='Tentar novamente'}finally{b.disabled=false}}
document.addEventListener('click',e=>{const t=e.target.closest('[data-event-toggle]');if(t)toggleEvent(t.dataset.eventToggle);if(e.target.closest('[data-require-login]')){if(confirm('Faça o login para se inscrever. Deseja acessar o login?'))location.href='/login'}});
(async()=>{try{const es=await call('obterVitrineEventos');const featured=document.getElementById('featured'),others=document.getElementById('events');featured.innerHTML=es.length?feEventCard(es[0],true):'<div class="empty">Nenhum evento publicado no momento.</div>';others.innerHTML=es.length>1?es.slice(1).map(e=>feEventCard(e)).join(''):'<div class="empty">Nenhum outro evento publicado no momento.</div>'}catch(e){document.getElementById('featured').innerHTML='<div class="empty">Não foi possível carregar os eventos. Atualize a página para tentar novamente.</div>';document.getElementById('events').innerHTML=''}})();
(async()=>{const box=document.getElementById('banners'),count=document.getElementById('bannerCount'),prev=document.getElementById('prevBanner'),next=document.getElementById('nextBanner');try{const bs=await call('obterBannersPublicos');let i=0,timer;function draw(){if(!bs.length){box.innerHTML='<div class="banner-empty fe-empty-banners">Nenhum banner ativo no momento.</div>';count.textContent='0 / 0';prev.disabled=next.disabled=true;return}const b=bs[i];const target=b.url||b.link||b.link_url||'';const safeLink=/^https?:\/\//i.test(target)?target:'';const banner=`<article class="banner-card">${b.image?`<div class="fe-banner-stage"><img class="fe-banner-blur" src="${feEsc(b.image)}" alt="" aria-hidden="true"><img class="fe-banner-foreground" src="${feEsc(b.image)}" alt="${feEsc(b.title||b.name||'Banner')}"></div>`:'<div class="banner-image-fallback"></div>'}<div class="banner-copy"><h2>${feEsc(b.title||b.name||'')}</h2><p>${feEsc(b.synopsis||'')}</p>${safeLink?`<a class="banner-cta" href="${feEsc(safeLink)}" target="_blank" rel="noopener noreferrer">Saiba mais ↗</a>`:''}</div></article><div class="dots" aria-label="Indicador de banner">${bs.map((_,n)=>n===i?'●':'○').join(' ')}</div>`;box.innerHTML=banner;count.textContent=`${i+1} / ${bs.length}`;prev.disabled=next.disabled=bs.length<2}function go(step){i=(i+step+bs.length)%bs.length;draw();restart()}function restart(){clearInterval(timer);if(bs.length>1)timer=setInterval(()=>{i=(i+1)%bs.length;draw()},5000)}prev.addEventListener('click',()=>go(-1));next.addEventListener('click',()=>go(1));box.addEventListener('mouseenter',()=>clearInterval(timer));box.addEventListener('mouseleave',restart);box.addEventListener('focusin',()=>clearInterval(timer));box.addEventListener('focusout',restart);draw();restart()}catch(e){box.innerHTML='<div class="empty">Não foi possível carregar os banners.</div>';prev.disabled=next.disabled=true}})();
</script></body></html>
