{% extends "base.html" %}{% block content %}<h1>Cadastrar Modelos</h1>{% if message %}<div class="notice">{{message}}</div>{% endif %}<form class="panel form" method="post" enctype="multipart/form-data"><label>Modelo<input type="file" name="model" required></label><small>Nome: pt_..._a, pt_..._m, en_..._a etc.</small><button class="primary">Salvar modelo</button></form><table><tr><th>Modelo</th><th>Visualizar</th><th>Ação</th></tr>{% for m in models %}<tr><td>{{m.filename}}</td><td>{{m.storage_path}}</td><td><form method="post" action="/certificados/modelos/{{m.id}}/excluir"><button class="danger">Excluir</button></form></td></tr>{% else %}<tr><td colspan="3">Nenhum modelo.</td></tr>{% endfor %}</table>{% endblock %}
