<!doctype html><html lang="pt-br"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cadastro | ForEvento</title><link rel="stylesheet" href="/static/css/app_new.css?v=20261008i18n4"><script src="/static/js/app_new.js?v=20261008i18n4"></script></head>
<body class="fe-auth-page"><header class="fe-public-top"><a class="fe-logo" href="/">For<span>Evento</span></a><a class="fe-back" href="/" data-i18n="backVitrine">← Voltar à Vitrine</a></header>
<main class="fe-auth-layout"><section class="fe-auth-card"><div class="fe-auth-heading"><span class="fe-eyebrow" data-i18n="newRegistration">NOVO CADASTRO</span><h1 data-i18n="registerTitle">Crie sua conta</h1><p data-i18n="registerIntro">Preencha seus dados para participar dos eventos.</p></div>
<div class="fe-language-list" role="group" aria-label="Idioma"><button type="button" class="fe-language" data-code="pt" aria-pressed="false"><img src="/static/images/flags/pt.png" alt=""><span>Português</span></button><button type="button" class="fe-language" data-code="en" aria-pressed="false"><img src="/static/images/flags/en.png" alt=""><span>English</span></button><button type="button" class="fe-language" data-code="es" aria-pressed="false"><img src="/static/images/flags/es.png" alt=""><span>Español</span></button><button type="button" class="fe-language" data-code="fr" aria-pressed="false"><img src="/static/images/flags/fr.png" alt=""><span>Français</span></button><button type="button" class="fe-language" data-code="it" aria-pressed="false"><img src="/static/images/flags/it.png" alt=""><span>Italiano</span></button><button type="button" class="fe-language" data-code="zh" aria-pressed="false"><img src="/static/images/flags/zh.png" alt=""><span>中文</span></button></div>
<form id="registerForm" class="fe-auth-form" novalidate>
<label for="nome"><span data-i18n="fullName">Nome completo</span> <span class="fe-required" aria-label="obrigatório">*</span></label><input class="field fe-upper" id="nome" autocomplete="name" required maxlength="180" placeholder="NOME COMPLETO">
<div id="cpfBox"><label for="cpf"><span>CPF</span> <span class="fe-required" id="cpfRequired">*</span></label><input class="field" id="cpf" inputmode="numeric" autocomplete="off" maxlength="14" placeholder="000.000.000-00"><small id="cpfHint" data-i18n="cpfHint">Se informado, o CPF deve ser válido.</small></div>
<label for="tel"><span data-i18n="phone">Telefone</span> <span class="fe-required">*</span></label><div class="fe-phone-row"><select class="field" id="ddi" aria-label="Código telefônico" data-i18n-aria="phoneCountry"><option value="+55">BR +55</option><option value="+1">US +1</option><option value="+351">PT +351</option><option value="+34">ES +34</option><option value="+33">FR +33</option><option value="+39">IT +39</option><option value="+86">CN +86</option><option value="+44">GB +44</option><option value="+49">DE +49</option></select><input class="field" id="tel" type="tel" autocomplete="tel-national" required placeholder="(21) 99999-9999"></div>
<label for="email"><span data-i18n="email">E-mail</span> <span class="fe-required">*</span></label><input class="field" id="email" type="email" autocomplete="email" required placeholder="nome@exemplo.com">
<label for="senha"><span data-i18n="password">Senha</span> <span class="fe-required">*</span></label><div class="fe-password-wrap"><input class="field" id="senha" type="password" autocomplete="new-password" minlength="4" required><button class="fe-eye" type="button" data-toggle-password="senha" data-i18n="show">Mostrar</button></div>
<label for="confirmarSenha">Confirmar senha <span class="fe-required">*</span></label><div class="fe-password-wrap"><input class="field" id="confirmarSenha" type="password" autocomplete="off" minlength="4" required><button class="fe-eye" type="button" data-toggle-password="confirmarSenha">Mostrar</button></div>
<button class="btn blue full fe-primary" type="submit" data-i18n="createAccount">Cadastrar</button><p class="fe-auth-alt"><span data-i18n="already">Já possui uma conta?</span> <a href="/login" data-i18n="enter">Entrar</a></p><p id="msg" class="fe-feedback" role="alert" aria-live="polite"></p></form></section></main><footer class="fe-auth-footer" data-i18n="authFooter">ForEvento · Gestão de eventos e certificados</footer>
<script>
document.addEventListener('DOMContentLoaded',()=>{
 const $=id=>document.getElementById(id), tr=(key)=>((feDictionary[feGetLanguage()]||feDictionary.pt)[key]||feDictionary.pt[key]||key);
 function updateCPFRequirement(){const required=feGetLanguage()==='pt';$('cpf').required=required;$('cpfRequired').hidden=!required;$('cpfHint').textContent=required?tr('cpfRequiredHint'):tr('cpfHint');}
 function formatCPF(){let d=$('cpf').value.replace(/\D/g,'').slice(0,11);$('cpf').value=d.slice(0,3)+(d.length>3?'.'+d.slice(3,6):'')+(d.length>6?'.'+d.slice(6,9):'')+(d.length>9?'-'+d.slice(9,11):'');}
 function formatPhone(){let el=$('tel'),d=el.value.replace(/\D/g,'');if($('ddi').value==='+55'){d=d.slice(0,11);el.value=d.length>2?'('+d.slice(0,2)+') '+d.slice(2,d.length===11?7:6)+(d.length>(d.length===11?7:6)?'-'+d.slice(d.length===11?7:6):''):d;}else el.value=el.value.slice(0,24);}
 feInitLanguages(()=>{updateCPFRequirement();$('msg').textContent='';});$('cpf').addEventListener('input',formatCPF);$('nome').addEventListener('input',()=>{$('nome').value=$('nome').value.toLocaleUpperCase()});$('tel').addEventListener('input',formatPhone);$('ddi').addEventListener('change',()=>{$('tel').value='';$('tel').placeholder=$('ddi').value==='+55'?'(21) 99999-9999':tr('internationalPhone')});
 $('registerForm').addEventListener('submit',async e=>{e.preventDefault();let cpf=$('cpf').value,br=feGetLanguage()==='pt',phone=$('tel').value.replace(/\D/g,'');function error(key,focus){$('msg').textContent=tr(key);$(focus).focus();}
 if(!$('nome').value.trim())return error('requiredFields','nome');if(br&&!cpf)return error('cpfMandatory','cpf');if(cpf&&!feValidCPF(cpf))return error('cpfInvalid','cpf');if(phone.length<7||($('ddi').value==='+55'&&![10,11].includes(phone.length)))return error('phoneInvalid','tel');if(!$('email').validity.valid||!$('email').value.trim())return error('emailInvalid','email');if($('senha').value.length<4)return error('passwordInvalid','senha');if($('senha').value!==$('confirmarSenha').value){$('msg').textContent='As senhas não coincidem.';return $('confirmarSenha').focus();}
 const b=e.submitter||document.querySelector('.fe-primary');b.disabled=true;try{const r=await call('cadastrarUsuario',{nome:$('nome').value.trim().toLocaleUpperCase(),cpf:cpf,telefone:$('ddi').value+' '+$('tel').value,email:$('email').value.trim(),senha:$('senha').value,confirmarSenha:$('confirmarSenha').value,idioma:feGetLanguage()});$('msg').textContent=r.mensagem||tr('saveFailed');if(r.sucesso)location.href='/login?lang='+encodeURIComponent(feGetLanguage());}catch(err){$('msg').textContent=err.message}finally{b.disabled=false;}
 });updateCPFRequirement();
});
</script></body></html>
