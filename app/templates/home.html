{% extends "base.html" %}{% block content %}<div class="hero"><h1>Eventos</h1><p>Conheça os eventos e seus cronogramas.</p></div><div class="event-grid">{% for e in events %}<a class="event-card" href="/evento/{{e.id}}"><div class="event-image">EVENTO</div><h2>{{e.name}}</h2><p>{{e.summary}}</p><small>{{e.period}} · {{e.location}}</small></a>{% else %}<div class="empty">Nenhum evento publicado.</div>{% endfor %}</div>{% endblock %}
