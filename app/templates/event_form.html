{% extends "base.html" %}{% block content %}
<h1>{{"Alterar Evento" if event else "Configurar Novo Evento"}}</h1><form class="event-form" method="post" action="/admin/eventos/salvar" enctype="multipart/form-data">
<input type="hidden" name="event_id" value="{{event.id if event else ''}}">
<section class="panel widepanel"><h2>Dados do Evento</h2><div class="grid2">
<label>Código oficial<input value="{{event.code if event and event.status!='RASCUNHO' else 'Será gerado na publicação'}}" disabled><small>Rascunho só recebe código EVT ao publicar.</small></label>
<label>Imagem de capa<input type="file" name="cover" accept="image/*"></label>
<label>Nome do Evento<input name="name" required value="{{event.name if event else ''}}"></label>
<label>Resumo do Evento<input name="summary" required value="{{event.summary if event else ''}}"></label>
<label>Período<input name="period" required placeholder="Ex: Novembro de 2026" value="{{event.period if event else ''}}"></label>
<label>Local / Plataforma Geral<input name="location" required value="{{event.location if event else ''}}"></label>
<label>Vagas Totais<input type="number" name="capacity" min="0" value="{{event.capacity if event else 0}}"></label>
<label>Palavra-Chave GERAL<input name="keyword" value="{{event.keyword if event else 'GERAL'}}"></label></div>
<label>Sinopse Geral do Cronograma<textarea name="schedule_synopsis">{{event.schedule_synopsis if event else ''}}</textarea></label></section>
<section class="panel widepanel"><div class="pagehead"><h2>📅 Cronograma Acadêmico</h2><button type="button" onclick="addActivity()">＋ Deseja Inserir atividade?</button></div><div id="activities">
{% for a in activities %}<div class="activity-editor">
<input type="hidden" name="activity_id" value="{{a.id}}"><div class="grid3">
<label>Data<input name="activity_date" value="{{a.date}}" placeholder="dd/mm/yyyy"></label><label>Hora Início<input type="time" name="activity_start" value="{{a.start_time}}"></label><label>Hora Término<input type="time" name="activity_end" value="{{a.end_time}}"></label></div>
<div class="grid2"><label>Tipo de Atividade<select name="activity_type">{% for x in ["Palestra","Oficina","Mesa-redonda","Curso","Apresentação","Outro"] %}<option {% if a.activity_type==x %}selected{% endif %}>{{x}}</option>{% endfor %}</select></label><label>Ministrante<input name="activity_speaker" value="{{a.speaker}}"></label>
<label>Modalidade<select name="activity_modality">{% for x in ["Presencial","Online","Híbrida"] %}<option {% if a.modality==x %}selected{% endif %}>{{x}}</option>{% endfor %}</select></label><label>Vagas específicas<input type="number" name="activity_specific_capacity" value="{{a.specific_capacity}}"></label>
<label>Local<input name="activity_location" value="{{a.location}}"></label><label>Endereço eletrônico<input name="activity_electronic" value="{{a.electronic_address}}"></label>
<label>Vagas<input type="number" name="activity_capacity" value="{{a.capacity}}"></label><label>Carga horária (minutos)<input type="number" name="activity_workload" value="{{a.workload_minutes}}"></label>
<label>Preço<select name="activity_price_model"><option value="Gratis" {% if a.price_model=="Gratis" %}selected{% endif %}>Grátis</option><option value="Pago" {% if a.price_model=="Pago" %}selected{% endif %}>Pago</option></select></label><label>Valor<input type="number" step="0.01" name="activity_price" value="{{a.price}}"></label></div>
<label>Currículo<textarea name="activity_curriculum">{{a.curriculum}}</textarea></label><label>Ementa<textarea name="activity_syllabus">{{a.syllabus}}</textarea></label><label>Sinopse curta<textarea name="activity_synopsis">{{a.short_synopsis}}</textarea></label><button type="button" class="danger" onclick="this.closest('.activity-editor').remove()">Remover atividade</button></div>{% endfor %}</div></section>
<div class="sticky-actions"><button name="action" value="draft">💾 Salvar Rascunho</button><button class="success" name="action" value="publish">🚀 Publicar Evento</button></div></form>
<template id="activityTpl"><div class="activity-editor"><input type="hidden" name="activity_id" value="0"><div class="grid3"><label>Data<input name="activity_date" placeholder="dd/mm/yyyy"></label><label>Hora Início<input type="time" name="activity_start"></label><label>Hora Término<input type="time" name="activity_end"></label></div><div class="grid2"><label>Tipo de Atividade<select name="activity_type"><option>Palestra</option><option>Oficina</option><option>Mesa-redonda</option><option>Curso</option><option>Apresentação</option><option>Outro</option></select></label><label>Ministrante<input name="activity_speaker"></label><label>Modalidade<select name="activity_modality"><option>Presencial</option><option>Online</option><option>Híbrida</option></select></label><label>Vagas específicas<input type="number" name="activity_specific_capacity" value="0"></label><label>Local<input name="activity_location"></label><label>Endereço eletrônico<input name="activity_electronic"></label><label>Vagas<input type="number" name="activity_capacity" value="0"></label><label>Carga horária (minutos)<input type="number" name="activity_workload" value="0"></label><label>Preço<select name="activity_price_model"><option value="Gratis">Grátis</option><option value="Pago">Pago</option></select></label><label>Valor<input type="number" step="0.01" name="activity_price" value="0"></label></div><label>Currículo<textarea name="activity_curriculum"></textarea></label><label>Ementa<textarea name="activity_syllabus"></textarea></label><label>Sinopse curta<textarea name="activity_synopsis"></textarea></label><button type="button" class="danger" onclick="this.closest('.activity-editor').remove()">Remover atividade</button></div></template>
{% endblock %}
