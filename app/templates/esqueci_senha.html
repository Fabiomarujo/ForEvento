<!doctype html><html lang="pt-br"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recuperar senha | ForEvento</title><link rel="stylesheet" href="/static/css/app_new.css?v=20261008i18n4"><script src="/static/js/app_new.js?v=20261008i18n4"></script></head><body class="fe-auth-page"><header class="fe-public-top"><a class="fe-logo" href="/">For<span>Evento</span></a><a class="fe-back" href="/" data-i18n="backVitrine">← Voltar à Vitrine</a></header><main class="fe-auth-layout"><section class="fe-auth-card"><div class="fe-auth-heading"><span class="fe-eyebrow" data-i18n="security">SEGURANÇA</span><h1 data-i18n="forgotTitle">Recuperar senha</h1><p data-i18n="forgotIntro">Informe seu e-mail cadastrado para continuar.</p></div><div class="fe-language-list" role="group" aria-label="Idioma"><button type="button" class="fe-language" data-code="pt" aria-pressed="false"><img src="/static/images/flags/pt.png" alt=""><span>Português</span></button><button type="button" class="fe-language" data-code="en" aria-pressed="false"><img src="/static/images/flags/en.png" alt=""><span>English</span></button><button type="button" class="fe-language" data-code="es" aria-pressed="false"><img src="/static/images/flags/es.png" alt=""><span>Español</span></button><button type="button" class="fe-language" data-code="fr" aria-pressed="false"><img src="/static/images/flags/fr.png" alt=""><span>Français</span></button><button type="button" class="fe-language" data-code="it" aria-pressed="false"><img src="/static/images/flags/it.png" alt=""><span>Italiano</span></button><button type="button" class="fe-language" data-code="zh" aria-pressed="false"><img src="/static/images/flags/zh.png" alt=""><span>中文</span></button></div><form class="fe-auth-form" id="forgotForm"><label for="email" data-i18n="email">E-mail</label><input class="field" id="email" type="email" autocomplete="email" required><button class="btn blue full fe-primary" type="submit" data-i18n="continue">Continuar</button><p class="fe-auth-alt"><a href="/login" data-i18n="backLogin">← Voltar ao Login</a></p><div id="msg" class="fe-feedback" role="status"></div><div id="resetArea"></div></form></section></main><footer class="fe-auth-footer" data-i18n="authFooter">ForEvento · Gestão de eventos e certificados</footer><script>feInitLanguages();document.getElementById('forgotForm').addEventListener('submit',async e=>{e.preventDefault();try{let r=await call('recuperarSenhaCasada',document.getElementById('email').value);document.getElementById('msg').textContent=r.mensagem||'';if(r.sucesso&&r.tokenTesteLocal){const area=document.getElementById('resetArea');area.innerHTML='<label for="nova">Nova senha</label><input id="nova" type="password" class="field" required minlength="4"><button class="btn blue full" type="button" id="resetBtn">Redefinir senha</button>';document.getElementById('resetBtn').onclick=async()=>{try{let q=await call('redefinirSenha',{token:r.tokenTesteLocal,novaSenha:document.getElementById('nova').value});document.getElementById('msg').textContent=q.mensagem||''}catch(err){document.getElementById('msg').textContent=err.message}}}}catch(err){document.getElementById('msg').textContent=err.message}});</script></body></html>
