{% extends "base.html" %}{% block content %}<form class="panel form" method="post"><h1>Cadastro</h1>{% if error %}<div class="error">{{error}}</div>{% endif %}<label>Idioma<select name="language">{% for code,img,label in langs %}<option value="{{code}}">{{code|upper}} — {{label}}</option>{% endfor %}</select></label><label>Nome<input name="name" required></label><label>CPF <small>(obrigatório somente para Português)</small><input name="cpf"></label><label>Telefone<input name="phone" required></label><label>E-mail<input name="email" type="email" required></label><label>Senha<input name="password" type="password" required></label><button class="primary wide">Cadastrar</button></form>{% endblock %}
