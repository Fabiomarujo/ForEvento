{% extends "base.html" %}{% block content %}<h1>Configurar Certificados</h1><form class="filters"><select name="event_id" onchange="this.form.submit()"><option value="">Selecione o evento...</option>{% for e in events %}<option value="{{e.id}}" {% if event_id==e.id %}selected{% endif %}>{{e.name}}</option>{% endfor %}</select></form>{% if event_id %}<form class="panel form" method="post"><input type="hidden" name="event_id" value="{{event_id}}"><label>Tipo de assinatura<select name="signature_type"><option value="AUTOMATICA" {% if not cfg or cfg.signature_type=="AUTOMATICA" %}selected{% endif %}>Automática (_a)</option><option value="MANUAL" {% if cfg and cfg.signature_type=="MANUAL" %}selected{% endif %}>Manual (_m)</option></select></label><label>Assunto<input name="email_subject" value="{{cfg.email_subject if cfg else 'Seu certificado - {{EVENTO}}'}}"></label><label>Texto do e-mail<textarea name="email_body">{{cfg.email_body if cfg else 'Olá {{NOME}}, agradecemos sua participação em {{EVENTO}}. Certificado: {{LINK_CERTIFICADO}} Código: {{CODIGO_CREDENCIAL}} URL: {{URL_CREDENCIAL}}'}}</textarea></label><button class="primary">Salvar</button></form>{% endif %}{% endblock %}
