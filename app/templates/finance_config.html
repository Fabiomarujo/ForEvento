{% extends "base.html" %}{% block content %}<h1>Configurar Pagamento por Evento</h1><form class="filters" method="get"><select name="event_id" onchange="this.form.submit()"><option value="">Selecione um evento...</option>{% for e in events %}<option value="{{e.id}}" {% if event and event.id==e.id %}selected{% endif %}>{{e.code}} — {{e.name}}</option>{% endfor %}</select></form>
{% if event %}<form class="panel form" method="post"><input type="hidden" name="event_id" value="{{event.id}}"><label>Forma de pagamento <span class="tip" title="API: confirmação automática por webhook. Manual: mostra chave Pix e exige comprovante.">ⓘ</span><select name="payment_mode"><option value="API" {% if event.payment_mode=="API" %}selected{% endif %}>Pix automático por API</option><option value="MANUAL" {% if event.payment_mode=="MANUAL" %}selected{% endif %}>Somente chave Pix + comprovante</option></select></label>
<label>Nome do recebedor <span class="tip" title="Nome que o participante deve conferir antes de pagar.">ⓘ</span><input name="pix_receiver" value="{{event.pix_receiver}}"></label><label>Chave Pix <span class="tip" title="Usada no modo manual e como referência administrativa.">ⓘ</span><input name="pix_key" value="{{event.pix_key}}"></label>
<label>Provedor API <span class="tip" title="Ex.: Mercado Pago. Credenciais privadas ficam no servidor e não nesta tela pública.">ⓘ</span><input name="pix_provider" value="{{event.pix_provider}}"></label><label>Ambiente <span class="tip" title="Use TESTE durante integração e PRODUÇÃO somente após validar webhook e consulta.">ⓘ</span><select name="pix_environment"><option>TESTE</option><option {% if event.pix_environment=="PRODUÇÃO" %}selected{% endif %}>PRODUÇÃO</option></select></label><label>Prazo do pagamento (minutos) <span class="tip" title="Tempo de reserva temporária da vaga antes de liberar novamente.">ⓘ</span><input type="number" name="deadline" value="{{event.payment_deadline_minutes}}"></label><button class="primary">Salvar</button></form>{% endif %}{% endblock %}
