{% extends "base.html" %}{% block content %}<a href="/">← Vitrine</a><h1>{{event.name}}</h1><p>{{event.summary}}</p><h2>Cronograma</h2><div class="list">{% for a in activities %}<button class="rowcard" onclick="{% if user %}location.href='/dashboard'{% else %}showLogin(){% endif %}"><b>{{a.date}} {{a.start_time}} — {{a.activity_type}}</b><span>{{a.short_synopsis}} · {{a.modality}} · Vagas {{a.capacity}} · {% if a.price>0 %}R$ {{'%.2f'|format(a.price)}}{% else %}Gratuita{% endif %}</span></button>{% endfor %}</div><div id="loginModal" class="modal" hidden><div class="modalbox"><h2>Faça o login para se inscrever</h2><div class="actions"><button onclick="hideLogin()">Fechar</button><a class="primary" href="/login">Ir para Login</a></div></div></div>{% endblock %}
