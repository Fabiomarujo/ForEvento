<!doctype html><html lang="pt-br"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login | ForEvento</title><link rel="stylesheet" href="/static/css/app_new.css?v=20261008i18n4"><script src="/static/js/app_new.js?v=20261008i18n4"></script></head><body class="fe-auth-page"><header class="fe-public-top"><a class="fe-logo" href="/">For<span>Evento</span></a><a class="fe-back" href="/" data-i18n="backVitrine">← Voltar à Vitrine</a></header><main class="fe-auth-layout"><section class="fe-auth-card"><div class="fe-auth-heading"><span class="fe-eyebrow" data-i18n="accessLabel">ACESSO À PLATAFORMA</span><h1 data-i18n="loginTitle">Bem-vindo ao ForEvento</h1><p data-i18n="loginIntro">Entre para acompanhar seus eventos, inscrições e certificados.</p></div><div class="fe-language-list" id="languages" role="group" aria-label="Idioma"><button type="button" class="fe-language" data-code="pt" aria-pressed="false"><img src="/static/images/flags/pt.png" alt=""><span>Português</span></button><button type="button" class="fe-language" data-code="en" aria-pressed="false"><img src="/static/images/flags/en.png" alt=""><span>English</span></button><button type="button" class="fe-language" data-code="es" aria-pressed="false"><img src="/static/images/flags/es.png" alt=""><span>Español</span></button><button type="button" class="fe-language" data-code="fr" aria-pressed="false"><img src="/static/images/flags/fr.png" alt=""><span>Français</span></button><button type="button" class="fe-language" data-code="it" aria-pressed="false"><img src="/static/images/flags/it.png" alt=""><span>Italiano</span></button><button type="button" class="fe-language" data-code="zh" aria-pressed="false"><img src="/static/images/flags/zh.png" alt=""><span>中文</span></button></div><form id="loginForm" class="fe-auth-form"><label for="email" data-i18n="email">E-mail</label><input class="field" id="email" type="email" autocomplete="username" required placeholder="nome@exemplo.com"><label for="senha" data-i18n="password">Senha</label><div class="fe-password-wrap"><input class="field" id="senha" type="password" autocomplete="current-password" required><button class="fe-eye" type="button" data-toggle-password="senha" aria-label="Mostrar senha" data-i18n="show">Mostrar</button></div><button class="btn blue full fe-primary" type="submit" data-i18n="enter">Entrar</button><div class="fe-auth-links"><a href="/esqueci-senha" data-i18n="forgot">Esqueceu a senha?</a><a href="/cadastro" data-i18n="register">Criar cadastro</a></div><p id="msg" class="fe-feedback" role="status" aria-live="polite"></p></form></section></main><footer class="fe-auth-footer" data-i18n="authFooter">ForEvento · Gestão de eventos e certificados</footer><script>feInitLanguages();document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();const b=e.submitter||document.querySelector('.fe-primary');b.disabled=true;try{const r=await call('realizarLogin',document.getElementById('email').value,document.getElementById('senha').value,feGetLanguage());document.getElementById('msg').textContent=r.mensagem||'';if(r.sucesso){saveUser(r);location.href=r.destino?'/?page='+encodeURIComponent(r.destino):'/';}}catch(err){document.getElementById('msg').textContent=err.message}finally{b.disabled=false}});</script></body></html>
